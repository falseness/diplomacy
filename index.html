    <script>
        // TASK-1481: phones and tablets (mobilePhone) run portrait only. In landscape a full-window overlay covers the
        // game and swallows input; the game itself keeps running underneath.
        (function () {
            const overlay = document.getElementById('rotateOverlay')
            let shown = false
            const update = () => {
                shown = mobilePhone && window.innerWidth > window.innerHeight
                overlay.style.display = shown ? 'flex' : 'none'
            }
            const swallow = event => {
                if (!shown) return
                event.stopImmediatePropagation()
                if (event.cancelable) event.preventDefault()
            }
            for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'mousedown', 'mousemove', 'mouseup',
                'click', 'dblclick', 'contextmenu', 'wheel', 'touchstart', 'touchmove', 'touchend', 'touchcancel'])
                window.addEventListener(type, swallow, {capture: true, passive: false})
            window.addEventListener('resize', update)
            window.addEventListener('orientationchange', update)
            window.addEventListener('load', update)
            if (window.visualViewport) window.visualViewport.addEventListener('resize', update)
            update()
        })()

        function saveGame() {
            // A tutorial is never saved.
            if (gameSettings.tutorial)
                return
            try {
                let _grid = JSON.stringify(grid)
                let _players = JSON.stringify(players)
                let _external = JSON.stringify(external)
                let _externalProduction = JSON.stringify(externalProduction)
                let _nature = JSON.stringify(nature)
                let _goldmines = JSON.stringify(goldmines)
                let _timer = JSON.stringify(timer)
                let _whooseTurn = JSON.stringify(whooseTurn)
                let _gameRound = JSON.stringify(gameRound)
                localStorage.setItem(gameSlot + 'grid', _grid)
                localStorage.setItem(gameSlot + 'players', _players)
                localStorage.setItem(gameSlot + 'external', _external)
                localStorage.setItem(gameSlot + 'externalProduction', _externalProduction)
                localStorage.setItem(gameSlot + 'nature', _nature)
                localStorage.setItem(gameSlot + 'goldmines', _goldmines)
                localStorage.setItem(gameSlot + 'timer' + whooseTurn, _timer)
                localStorage.setItem(gameSlot + 'whooseTurn', _whooseTurn)
                localStorage.setItem(gameSlot + 'gameRound', _gameRound)
                localStorage.setItem(gameSlot + 'isFogOfWar', isFogOfWar)
                localStorage.setItem(gameSlot + 'gameSettings', JSON.stringify(gameSettings))

                let player_history = localStorage.getItem(gameSlot + 'Player:' + _whooseTurn)
                if (player_history == null)
                    player_history = []
                else {
                    player_history = JSON.parse(player_history)
                }
                let player_info = players[whooseTurn].historyInfo
                if (gameRound >= player_history.length) {
                    player_history.push(player_info)
                }
                else {
                    player_history[player_history.length - 1] = player_info
                }
                player_history = JSON.stringify(player_history)
                localStorage.setItem(gameSlot + 'Player:' + _whooseTurn, player_history)
                if (gameSettings.isOnline) {
                    return
                }

                // tmp
                return
                if (whooseTurn + 1 == players.length && !isFogOfWar) {
                    console.log('======HISTORY======')
                    // refactoring is needed
                    let histories = []
                    for (let i = 1; i < players.length; ++i) {
                        let history = localStorage.getItem(gameSlot +
                            'Player:' + i)
                        histories.push(JSON.parse(history))
                    }
                    let min_length = histories[0].length
                    for (let i = 1; i < histories.length; ++i) {
                        if (histories[i].length < min_length) {
                            min_length = histories[i]
                        }
                    }
                    for (let round = 0; round < min_length; ++round) {
                        console.log('ROUND ' + round)
                        let comparisons_titles = ['gold', 'income', 'suburbs',
                            'army cost', 'army salary']
                        let comparions = {}
                        for (let i = 0; i < comparisons_titles.length; ++i) {
                            comparions[comparisons_titles[i]] = ''
                        }
                        for (let title_index = 0; title_index <
                            comparisons_titles.length; ++title_index) {
                                let title = comparisons_titles[title_index]
                            for (let i = 0; i < histories.length; ++i) {
                                comparions[title] += histories[i][round][title] + ' '
                            }
                            console.log(title + ' ' + comparions[title])
                        }
                    }
                }
            }
            catch {
                errorWindow.textString = "can't save game\ntry toggle internet connection"
                errorWindow.enableTemporary()
            }
        }
        function hasSave(_slot) {

            let _goldmines = localStorage.getItem(gameSlot + 'goldmines')
            let _whooseTurn = localStorage.getItem(gameSlot + 'whooseTurn')
            let _timer = localStorage.getItem(gameSlot + 'timer' + Number(_whooseTurn))
            let _gameRound = localStorage.getItem(gameSlot + 'gameRound')
            let _isFogOfWar = localStorage.getItem(gameSlot + 'isFogOfWar')

            unpacker.unpackAll(_grid, _players, _external, _externalProduction,

            gameEvent.hideAll()
                //console.log("loaded")
            return true
        }
        function loadSlotInfo(_slot) {

        }
        // TASK-1483: the canvas follows the window. applyScreenSize reads the window size in device pixels and, when it
        // changed, sets WIDTH/HEIGHT, the canvas backing store and its box (the whole window, no letterbox), keeps the
        // camera's transform and the world point at the screen centre, re-lays the core HUD, brings the camera back
        // inside the new limits (GameManager.screenResized; an untouched fitted board is fitted again), then runs every
        // onScreenResize callback in registration order. The world basis stays the load-time one.
        function layoutCoreHud() {
            nextTurnButtonSize = WIDTH * 0.1
            const nextRect = nextTurnButton.rect
            nextRect.x = WIDTH - nextTurnButtonSize * 1.05
            nextRect.y = HEIGHT - nextTurnButtonSize * 1.05
            nextRect.width = nextRect.height = nextTurnButtonSize
            nextTurnButton.img.side = nextTurnButtonSize
            nextTurnButton.img.strokeWidth = 0.005 * HEIGHT
            nextTurnButton.img.pos = nextRect.center

            const icon = (button, size) => {
                button.rect.width = button.rect.height = size
                button.img.size = button.img.w = button.img.h = size
            }
            icon(undoButton, nextTurnButtonSize)
            undoButton.firstPos = {x: 0, y: HEIGHT - nextTurnButtonSize}
            undoButton.secondPos = {x: 0, y: entityInterface.top - nextTurnButtonSize}
            undoButton.pos = undoButton.selected == 2 ? undoButton.secondPos : undoButton.firstPos

            backToMenuButtonSize = nextTurnButtonSize * 2 / 3
            icon(backToMenuButton, backToMenuButtonSize)
            backToMenuButton.pos = {x: 0, y: 0}
            icon(iButton, nextTurnButtonSize)
            iButton.pos = {x: WIDTH - nextTurnButtonSize, y: 0}

            const errorRect = errorWindow.rect, corner = 0.03 * HEIGHT
            errorRect.width = WIDTH * 0.4
            errorRect.height = WIDTH * 0.55 * 0.1
            errorRect.y = HEIGHT * 0.75
            errorRect.cornerRadius = [corner, corner, corner, corner]
            errorRect.strokeWidth = HEIGHT * 0.005
            errorRect.centerX = WIDTH / 2
            errorWindow.text.fontSize = WIDTH * 0.55 * 0.05
            errorWindow.trimText()

            if (typeof timer !== 'undefined' && timer && typeof timer.layout === 'function')
                timer.layout()
        }
        function applyScreenSize() {
            const dpr = window.devicePixelRatio || 1
            const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr)
            mainCanvas.style.width = window.innerWidth + 'px'
            mainCanvas.style.height = window.innerHeight + 'px'
            if (w === Math.round(WIDTH) && h === Math.round(HEIGHT) && mainCanvas.width === w && mainCanvas.height === h)
                return false
            const oldWidth = WIDTH, oldHeight = HEIGHT
            const inGame = !menu.visible && !!mapBorder
            const fitted = inGame && gameEvent.screen.isFittedView()
            const centre = {x: canvas.offset.x + width / 2, y: canvas.offset.y + height / 2}
            const transform = mainCtx.getTransform()

            WIDTH = w
            HEIGHT = h
            // A new backing store resets the context: the camera transform is put back.
            mainCanvas.width = w
            mainCanvas.height = h
            mainCtx.setTransform(transform)
            width = WIDTH / canvas.scale
            height = HEIGHT / canvas.scale
            if (inGame) {
                const old = {x: canvas.offset.x, y: canvas.offset.y}
                canvas.offset.x = centre.x - width / 2
                canvas.offset.y = centre.y - height / 2
                cameraTransform.translate(old.x - canvas.offset.x, old.y - canvas.offset.y)
            }
            if (typeof gameEvent.screen.screenResized === 'function')
                gameEvent.screen.screenResized(oldWidth, oldHeight)
            layoutCoreHud()
            atmosphericBackground.viewport = [window.innerWidth, window.innerHeight]
            GameManager.screenResized()
            if (fitted)
                GameManager.fitCamera()
            const info = {width: WIDTH, height: HEIGHT, oldWidth, oldHeight}
            for (const fn of screenResizeCallbacks.slice()) {
                try {
                    fn(info)
                }
                catch (e) {
                    // One broken callback does not stop the others; the error still reaches the page.
                    setTimeout(() => { throw e })
                }
            }
            return true
        }
        // Size events come in bursts (address bar, rotation): one re-layout per animation frame, and a final one
        // 250 ms after the last event (a size can settle without another event; rAF stops in a hidden page).
        let screenSizeFrame = 0, screenSizeSettle = 0
        function scheduleScreenSize() {
            if (!screenSizeFrame)
                screenSizeFrame = requestAnimationFrame(() => {
                    screenSizeFrame = 0
                    applyScreenSize()
                })
            clearTimeout(screenSizeSettle)
            screenSizeSettle = setTimeout(applyScreenSize, 250)
        }
        function start() {

            mainCanvas.width = WIDTH
            mainCanvas.height = HEIGHT
            applyScreenSize()
            for (const type of ['resize', 'orientationchange', 'pageshow'])
                window.addEventListener(type, scheduleScreenSize)
            if (window.visualViewport)
                window.visualViewport.addEventListener('resize', scheduleScreenSize)
            // A size that changed without a resize event (a late mobile layout) is caught after load too.
            requestAnimationFrame(() => requestAnimationFrame(applyScreenSize))
            setTimeout(applyScreenSize, 500)

            loadOtherSettings()
            loadAssets()

            //menu.start()
            requestAnimationFrame(waitForImagesLoad)
        }
        window.addEventListener('load', start)
        window.onblur = function() {
            if (!menu.visible && !debug && !gameSettings.isOnline) {
                // menuBack()
            }
        }
