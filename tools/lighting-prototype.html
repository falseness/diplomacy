<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lighting prototype (standalone, no game integration)</title>
<style>html, body { margin: 0; background: #071221; overflow: hidden } canvas { display: block }</style>
<!-- Real hex geometry: basis/biasToTransition (gameCoords), Sprite.calcPos and
     neighborhood (sprite), MapDepth.getVertices (border). -->
<script src="../options/gameCoords.js"></script>
<script src="../sprites/sprite.js"></script>
<script src="../sprites/border.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<script>
'use strict'
// Fixed board: maps['fight forever'][0] from options/gamestart.js, camera as in
// artifacts/TASK-1050/screenshots/desktop-final.png (scale 0.3, cell 0,0 at 420,151
// on a 1440 px wide view). Everything below is visual only.
const MAP = {
    size: {x: 40, y: 30},
    neutralTowns: [{x: 12, y: 15}, {x: 27, y: 14}, {x: 31, y: 24}, {x: 18, y: 24}, {x: 8, y: 5}, {x: 21, y: 5}],
    players: [
        {rgb: [255, 0, 0], towns: [{x: 15, y: 28}, {x: 17, y: 1}, {x: 38, y: 23}]},
        {rgb: [139, 0, 255], towns: [{x: 24, y: 1}, {x: 22, y: 28}, {x: 1, y: 6}]}
    ],
    goldmines: [{x: 18, y: 15}, {x: 18, y: 21}, {x: 13, y: 27}, {x: 21, y: 14}, {x: 21, y: 8}, {x: 26, y: 2},
        {x: 4, y: 11}, {x: 6, y: 22}, {x: 3, y: 26}, {x: 7, y: 24}, {x: 2, y: 23}, {x: 5, y: 17}, {x: 10, y: 9},
        {x: 35, y: 18}, {x: 33, y: 7}, {x: 36, y: 3}, {x: 32, y: 5}, {x: 37, y: 6}, {x: 34, y: 12}, {x: 29, y: 20},
        {x: 2, y: 4}, {x: 13, y: 5}, {x: 37, y: 25}, {x: 26, y: 24}, {x: 32, y: 16}, {x: 11, y: 18},
        {x: 7, y: 13}, {x: 28, y: 11}, {x: 2, y: 16}, {x: 1, y: 13}, {x: 37, y: 13}, {x: 38, y: 16}],
    lakes: [{x: 15, y: 11}, {x: 16, y: 11}, {x: 17, y: 11}, {x: 18, y: 11}, {x: 24, y: 18}, {x: 23, y: 18},
        {x: 22, y: 18}, {x: 21, y: 18}, {x: 9, y: 21}, {x: 30, y: 8}, {x: 17, y: 24}, {x: 18, y: 25},
        {x: 22, y: 5}, {x: 21, y: 4}, {x: 14, y: 21}, {x: 13, y: 20}, {x: 13, y: 19}, {x: 12, y: 19},
        {x: 25, y: 8}, {x: 26, y: 9}, {x: 26, y: 10}, {x: 27, y: 10}, {x: 3, y: 15}, {x: 5, y: 15},
        {x: 5, y: 14}, {x: 36, y: 14}, {x: 34, y: 14}, {x: 34, y: 15}],
    mountains: [{x: 20, y: 12}, {x: 21, y: 12}, {x: 22, y: 12}, {x: 23, y: 11}, {x: 19, y: 17}, {x: 18, y: 17},
        {x: 17, y: 17}, {x: 16, y: 18}, {x: 5, y: 20}, {x: 6, y: 20}, {x: 7, y: 20}, {x: 8, y: 21},
        {x: 34, y: 9}, {x: 33, y: 9}, {x: 32, y: 9}, {x: 31, y: 8}, {x: 30, y: 21}, {x: 31, y: 20},
        {x: 32, y: 20}, {x: 33, y: 19}, {x: 9, y: 8}, {x: 8, y: 9}, {x: 7, y: 9}, {x: 6, y: 10},
        {x: 27, y: 25}, {x: 28, y: 26}, {x: 28, y: 27}, {x: 12, y: 4}, {x: 11, y: 3}, {x: 11, y: 2}]
}
const IMAGES = {
    town: 'assets/atmosphere/buildings/town.svg',
    goldmine: 'assets/atmosphere/buildings/goldmine.svg',
    lake: 'assets/atmosphere/nature/lake.svg',
    mountain: 'assets/atmosphere/nature/mountain.svg',
    noob: 'assets/sprites/noob.svg',
    clouds: 'assets/atmosphere/clouds.svg',
    i: 'assets/i.svg',
    undo: 'assets/undo.svg'
}

// Light model parameters (light map units: 0..255 per channel, 255 = full light).
const AMBIENT = [92, 97, 117]             // cool ambient, about rgb 0.36, 0.38, 0.46
// Lamp colours stay below white in green/blue so the pools read warm, not bleached.
// core: where the emitting part of the unchanged sprite sits (cave mouth, town windows),
// as a fraction of the sprite size from its centre.
const LAMP = {
    goldmine: {color: [255, 92, 26], power: 1.1, core: {x: 0.01, y: 0.14}},
    town: {color: [255, 96, 28], power: 1.2, core: {x: -0.06, y: 0.12}},
    demonPortal: {color: [255, 150, 96], power: 0.9, core: {x: 0, y: 0.1}}
}
const TAIL_RADII = 2.5                    // light tail reaches about 2.5 hex radii (basis.r)

const W = window.innerWidth, H = window.innerHeight
const view = document.getElementById('view')
view.width = W; view.height = H
// basis.r follows the device width (gameCoords WIDTH); 0.3 is the TASK-1050 camera scale.
const camera = {scale: 0.3 * W / WIDTH, x: 420 * W / 1440, y: 151 * W / 1440}
const R = basis.r                          // world hex radius
const SPACING = Math.sqrt(3) * R           // centre-to-centre distance between neighbours
const depth = new MapDepth()

function canvasOf(w = W, h = H) {
    const c = document.createElement('canvas')
    c.width = w; c.height = h
    return c
}
function cell(x, y) { return new Sprite(x, y).calcPos() }  // real hex centre in world units
function hexPath(ctx, pos, inset = 0) {
    const v = depth.getVertices(pos)
    const k = 1 - inset
    ctx.beginPath()
    v.forEach((p, i) => {
        const x = pos.x + (p.x - pos.x) * k, y = pos.y + (p.y - pos.y) * k
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    })
    ctx.closePath()
}
function world(ctx) { ctx.setTransform(camera.scale, 0, 0, camera.scale, camera.x, camera.y) }
function prng(seed) { return () => ((seed = Math.imul(seed, 1664525) + 1013904223 >>> 0) / 4294967296) }
function key(p) { return p.x + ':' + p.y }

const images = {}
function load() {
    return Promise.all(Object.entries(IMAGES).map(([name, src]) => new Promise((resolve, reject) => {
        const img = new Image()
        img.onload = () => { images[name] = img; resolve() }
        img.onerror = () => reject(new Error('failed to load ' + src))
        img.src = '../' + src
    })))
}

// ----- board content -------------------------------------------------------
function buildBoard() {
    const owner = new Map(), objects = [], lights = []
    for (const [i, p] of MAP.players.entries()) for (const t of p.towns) {
        owner.set(key(t), i)
        for (const n of new Sprite(t.x, t.y).neighbours) owner.set(key(n), i)
    }
    const add = (list, image, lamp) => { for (const c of list) {
        const pos = cell(c.x, c.y)
        objects.push({image, pos, coord: c, lamp: !!lamp})
        if (lamp) {
            const size = 1.6 * R, core = LAMP[image].core
            lights.push({pos, kind: image, ...LAMP[image],
                core: {x: pos.x + core.x * size, y: pos.y + core.y * size}})
        }
    } }
    add(MAP.lakes, 'lake'); add(MAP.mountains, 'mountain')
    add(MAP.goldmines, 'goldmine', true)
    add(MAP.neutralTowns, 'town', true)
    for (const p of MAP.players) add(p.towns, 'town', true)
    for (const p of MAP.players) for (const t of p.towns)
        objects.push({image: 'noob', pos: cell(t.x, t.y), coord: t, unit: true})
    return {owner, objects, lights}
}

// Strongest lamp influence at a point: direction (unit vector towards the light) and weight.
function lampFalloff(d) {
    const t = Math.max(0, 1 - d / (TAIL_RADII * R))
    return t * t
}
function lightVector(pos, lights, exclude) {
    let x = 0, y = 0, best = 0
    for (const l of lights) {
        if (l === exclude) continue
        const dx = l.pos.x - pos.x, dy = l.pos.y - pos.y, d = Math.hypot(dx, dy)
        if (d < 1) continue
        const w = lampFalloff(d) * l.power
        x += dx / d * w; y += dy / d * w
        best = Math.max(best, w)
    }
    return {x, y, strength: Math.hypot(x, y), best}
}
const KEY_DIR = {x: -0.62, y: -0.78}       // towards the key light (upper left)

// ----- layers --------------------------------------------------------------
function drawBackground(ctx) {
    ctx.drawImage(images.clouds, 0, 0, W, H)
    // Deeper navy night, as in the concept.
    ctx.save()
    ctx.globalCompositeOperation = 'multiply'
    ctx.fillStyle = 'rgb(118,128,170)'
    ctx.fillRect(0, 0, W, H)
    ctx.restore()
    // Warm amber light band falling from the upper left, like the concept sky.
    ctx.save()
    ctx.globalCompositeOperation = 'screen'
    const band = ctx.createLinearGradient(0, 0, W * 0.55, H * 0.75)
    band.addColorStop(0, 'rgba(230,130,50,0.75)')
    band.addColorStop(0.45, 'rgba(140,76,38,0.25)')
    band.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = band
    ctx.fillRect(0, 0, W, H)
    ctx.restore()
    // Deterministic embers.
    const rand = prng(1104)
    ctx.save()
    ctx.globalCompositeOperation = 'lighter'
    for (let i = 0; i < 110; ++i) {
        const x = rand() * W, y = rand() * H, r = (1 + rand() * 1.6) * W / 1440
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3)
        g.addColorStop(0, 'rgba(255,200,120,0.95)')
        g.addColorStop(0.35, 'rgba(255,150,60,0.45)')
        g.addColorStop(1, 'rgba(255,120,40,0)')
        ctx.fillStyle = g
        ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6)
    }
    ctx.restore()
}

function boardCells() {
    const cells = []
    for (let x = 0; x < MAP.size.x; ++x) for (let y = 0; y < MAP.size.y; ++y)
        cells.push({coord: {x, y}, pos: cell(x, y)})
    return cells
}

// Marble grain: a deterministic value-noise mask (shading only, no tile art). Veins are
// thin dark bands of a turbulent sine, the mottling is low-frequency noise.
let marbleCanvas = null
function marble() {
    if (marbleCanvas) return marbleCanvas
    const N = 256, c = canvasOf(N, N), g = c.getContext('2d'), img = g.createImageData(N, N)
    const rand = prng(7)
    const lattice = []
    for (let i = 0; i < 4; ++i) lattice.push(Array.from({length: 33 * 33}, rand))
    const smooth = t => t * t * (3 - 2 * t)
    const noise = (x, y, o) => {      // periodic value noise on a 32x32 lattice
        const xi = Math.floor(x), yi = Math.floor(y), fx = smooth(x - xi), fy = smooth(y - yi)
        const at = (i, j) => lattice[o][((j & 31) * 33) + (i & 31)]
        const a = at(xi, yi), b = at(xi + 1, yi), d = at(xi, yi + 1), e = at(xi + 1, yi + 1)
        return a + (b - a) * fx + (d - a) * fy + (a - b - d + e) * fx * fy
    }
    const fbm = (x, y) => noise(x, y, 0) * 0.5 + noise(2 * x, 2 * y, 1) * 0.25 +
        noise(4 * x, 4 * y, 2) * 0.15 + noise(8 * x, 8 * y, 3) * 0.1
    for (let y = 0; y < N; ++y) for (let x = 0; x < N; ++x) {
        const u = x / N * 32, v = y / N * 32
        const turb = fbm(u * 0.25, v * 0.25)
        const vein = Math.pow(Math.abs(Math.sin((u * 0.55 + v * 0.3 + turb * 7) )), 0.28)
        const mottle = 0.9 + 0.1 * fbm(u * 0.5 + 9, v * 0.5 + 3)
        const k = Math.round(255 * Math.min(1, (0.9 + 0.1 * vein) * (0.04 + mottle)))
        const i = (y * N + x) * 4
        img.data[i] = k; img.data[i + 1] = k; img.data[i + 2] = Math.min(255, k + 3); img.data[i + 3] = 255
    }
    g.putImageData(img, 0, 0)
    return marbleCanvas = c
}

// Bevel band of one hex edge: the strip between the tile outline and an inset outline.
const BEVEL = 0.17
function bevelPath(ctx, pos, v, i, width = BEVEL) {
    const a = v[i], b = v[(i + 1) % 6], k = 1 - width
    ctx.beginPath()
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y)
    ctx.lineTo(pos.x + (b.x - pos.x) * k, pos.y + (b.y - pos.y) * k)
    ctx.lineTo(pos.x + (a.x - pos.x) * k, pos.y + (a.y - pos.y) * k)
    ctx.closePath()
}
function edgeNormal(pos, v, i) {
    const a = v[i], b = v[(i + 1) % 6]
    const mx = (a.x + b.x) / 2 - pos.x, my = (a.y + b.y) / 2 - pos.y, ml = Math.hypot(mx, my)
    return {x: mx / ml, y: my / ml}
}

// Unlit albedo: existing tile colours tinted towards pale cream stone, a marble grain
// mask, the raised-tile bevel shaded by the key light, the board's side faces, joints.
function drawAlbedo(ctx, board, cells) {
    world(ctx)
    // Side faces: outline edges facing down are extruded by MapDepth.depth.
    ctx.fillStyle = '#9a948c'
    for (const c of cells) {
        const v = depth.getVertices(c.pos), parity = c.coord.x & 1
        for (let i = 2; i <= 4; ++i) {
            const n = {x: c.coord.x + neighborhood[parity][i][0], y: c.coord.y + neighborhood[parity][i][1]}
            if (n.x >= 0 && n.y >= 0 && n.x < MAP.size.x && n.y < MAP.size.y) continue
            const a = v[i], b = v[(i + 1) % 6]
            ctx.beginPath()
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y)
            ctx.lineTo(b.x, b.y + depth.depth); ctx.lineTo(a.x, a.y + depth.depth)
            ctx.closePath(); ctx.fill()
        }
    }
    const grain = marble()
    for (const c of cells) {
        const o = board.owner.get(key(c.coord))
        const rgb = o === undefined ? [208, 208, 208] : MAP.players[o].rgb
        hexPath(ctx, c.pos)
        ctx.fillStyle = `rgb(${rgb})`
        ctx.fill()
        if (o === undefined) {
            // (f) Neutral grey lifted to pale cream stone by a tint, not by new tile art.
            ctx.globalCompositeOperation = 'screen'
            ctx.fillStyle = 'rgb(214,196,160)'
            ctx.fill()
        }
        // Marble grain: a random window of the mask, multiplied inside the tile.
        const h = (Math.imul(c.coord.x + 1, 73856093) ^ Math.imul(c.coord.y + 1, 19349663)) >>> 0
        ctx.save()
        hexPath(ctx, c.pos)
        ctx.clip()
        ctx.globalCompositeOperation = 'multiply'
        ctx.globalAlpha = o === undefined ? 1 : 0.5
        const sx = h % 160, sy = (h >>> 8) % 160
        ctx.drawImage(grain, sx, sy, 72, 72, c.pos.x - R, c.pos.y - R, 2 * R, 2 * R)
        ctx.restore()
        ctx.globalCompositeOperation = 'source-over'
        // (d) Raised tile: bevel faces turned to the key light are bright, others darker.
        const v = depth.getVertices(c.pos)
        for (let i = 0; i < 6; ++i) {
            const n = edgeNormal(c.pos, v, i), f = n.x * KEY_DIR.x + n.y * KEY_DIR.y
            bevelPath(ctx, c.pos, v, i)
            if (f > 0) {
                ctx.globalCompositeOperation = 'screen'
                ctx.fillStyle = `rgba(255,246,228,${(0.42 * f).toFixed(3)})`
            } else {
                ctx.globalCompositeOperation = 'multiply'
                ctx.fillStyle = `rgba(160,148,142,${(0.55 * -f).toFixed(3)})`
            }
            ctx.fill()
        }
        ctx.globalCompositeOperation = 'source-over'
    }
    // Joints between tiles.
    ctx.lineWidth = 0.045 * R
    ctx.strokeStyle = 'rgba(78,70,70,0.75)'
    for (const c of cells) { hexPath(ctx, c.pos); ctx.stroke() }
}

// Silhouette of a sprite, used for its blurred ground shadow.
const silhouettes = {}
function silhouette(name) {
    if (silhouettes[name]) return silhouettes[name]
    const c = canvasOf(256, 256), g = c.getContext('2d')
    g.drawImage(images[name], 0, 0, 256, 256)
    g.globalCompositeOperation = 'source-in'
    g.fillStyle = '#000'
    g.fillRect(0, 0, 256, 256)
    return silhouettes[name] = c
}
// (e) Soft shadow: the sprite silhouette cast onto the ground plane away from the
// dominant light (key light plus nearby lamps): its height is laid along the shadow
// direction, then it is blurred and multiplied into the albedo.
function drawShadows(ctx, board) {
    const size = 1.6 * R
    for (const o of board.objects) {
        if (o.image === 'lake') continue
        const lamp = lightVector(o.pos, board.lights, board.lights.find(l => l.pos === o.pos))
        let dx = KEY_DIR.x + lamp.x * 0.8, dy = KEY_DIR.y + lamp.y * 0.8
        const len = Math.hypot(dx, dy) || 1
        dx /= -len; dy /= -len                // away from the light
        const s = o.unit ? size * 0.9 : size
        const reach = (o.unit ? 0.9 : 1.15) * s
        const baseY = o.pos.y + s * 0.3
        world(ctx)
        ctx.save()
        ctx.globalCompositeOperation = 'multiply'
        ctx.globalAlpha = 0.55
        ctx.filter = `blur(${Math.max(2, 0.08 * s * camera.scale).toFixed(2)}px)`
        // Image point (x, -t*s) lands at (x + t*reach*dx, t*reach*dy) on the ground.
        ctx.setTransform(camera.scale, 0, 0, camera.scale, camera.x, camera.y)
        ctx.translate(o.pos.x, baseY)
        ctx.transform(1, 0, -dx * reach / s, -dy * reach / s, 0, 0)
        ctx.drawImage(silhouette(o.image), -s / 2, -s, s, s)
        ctx.restore()
    }
}
function drawObjects(ctx, board) {
    const size = 1.6 * R
    world(ctx)
    const order = [...board.objects].sort((a, b) => (a.unit - b.unit) || (a.pos.y - b.pos.y))
    for (const o of order) {
        const s = o.unit ? size * 0.9 : size
        const y = o.unit ? o.pos.y + 0.05 * R : o.pos.y
        ctx.drawImage(images[o.image], o.pos.x - s / 2, y - s / 2, s, s)
    }
}

// (a) Light map: cool ambient, plus (c) the broad warm key light and its shafts, plus
// every lamp as a warm radial falloff with a bright core and a long soft tail, all added
// with 'lighter'. It is multiplied over the board afterwards.
function buildLightMap(board, lamps = true) {
    const map = canvasOf(), g = map.getContext('2d')
    g.fillStyle = `rgb(${AMBIENT})`
    g.fillRect(0, 0, W, H)
    g.globalCompositeOperation = 'lighter'
    // Key light: a broad cream wash over the whole board, fading towards the lower right,
    // plus a warmer lobe where it enters at the board's upper left.
    const ul = {x: camera.x, y: camera.y}
    // Where the warm key light falls, the cool ambient is filtered warm first ('multiply'),
    // so the lit stone turns gold rather than pink.
    g.globalCompositeOperation = 'multiply'
    const warm = g.createRadialGradient(ul.x, ul.y, 0, ul.x, ul.y, 0.7 * W)
    warm.addColorStop(0, 'rgb(255,236,214)')
    warm.addColorStop(0.6, 'rgb(255,246,226)')
    warm.addColorStop(1, 'rgb(255,255,255)')
    g.fillStyle = warm
    g.fillRect(0, 0, W, H)
    g.globalCompositeOperation = 'lighter'
    const keyLight = g.createLinearGradient(ul.x, ul.y, W, H)
    keyLight.addColorStop(0, 'rgb(44,36,22)')
    keyLight.addColorStop(0.5, 'rgb(70,63,50)')
    keyLight.addColorStop(1, 'rgb(12,12,16)')
    g.fillStyle = keyLight
    g.fillRect(0, 0, W, H)
    const lobeR = 0.55 * W
    const lobe = g.createRadialGradient(ul.x, ul.y, 0, ul.x, ul.y, lobeR)
    lobe.addColorStop(0, 'rgb(118,56,24)')
    lobe.addColorStop(0.5, 'rgb(60,28,12)')
    lobe.addColorStop(1, 'rgb(0,0,0)')
    g.fillStyle = lobe
    g.fillRect(0, 0, W, H)
    // Diagonal shafts of the same key light falling from the upper left.
    g.save()
    g.translate(ul.x - 0.1 * W, ul.y - 0.25 * W)
    g.rotate(Math.atan2(-KEY_DIR.y, -KEY_DIR.x) - Math.PI / 2)
    for (const [offset, width, alpha] of [[-0.3, 0.03, 0.24], [-0.17, 0.045, 0.3], [-0.05, 0.025, 0.22],
        [0.08, 0.05, 0.26], [0.22, 0.03, 0.18], [0.34, 0.04, 0.14]]) {
        const x = offset * W, w = width * W
        const shaft = g.createLinearGradient(x - w, 0, x + w, 0)
        shaft.addColorStop(0, 'rgba(255,172,90,0)')
        shaft.addColorStop(0.5, `rgba(255,172,90,${(0.8 * alpha).toFixed(3)})`)
        shaft.addColorStop(1, 'rgba(255,172,90,0)')
        g.fillStyle = shaft
        g.fillRect(x - w, 0, 2 * w, 2.2 * W)
    }
    g.restore()
    if (!lamps) return map
    world(g)
    // Near a lamp its warm light dominates: the cool ambient and key are filtered warm
    // ('multiply') before the lamp itself is added, so the pool keeps its colour.
    g.globalCompositeOperation = 'multiply'
    for (const l of board.lights) {
        const c = {x: l.core.x, y: l.core.y + 0.8 * R}, r = TAIL_RADII * R
        const filter = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, r)
        filter.addColorStop(0, 'rgb(255,222,150)')
        filter.addColorStop(0.5, 'rgb(255,238,205)')
        filter.addColorStop(1, 'rgb(255,255,255)')
        g.fillStyle = filter
        g.fillRect(c.x - r, c.y - r, 2 * r, 2 * r)
    }
    g.globalCompositeOperation = 'lighter'
    for (const l of board.lights) {
        // The pool spills forward (down the board) from the emitting core over the
        // neighbouring tiles; the soft tail reaches about 2.5 hex radii.
        const c = {x: l.core.x, y: l.core.y + 0.8 * R}
        const r = TAIL_RADII * R, [cr, cg, cb] = l.color
        g.save()
        g.translate(c.x, c.y)
        g.scale(0.95, 1.3)
        const lamp = g.createRadialGradient(0, 0, 0, 0, 0, r)
        const stop = (t, a) => lamp.addColorStop(t, `rgba(${cr},${cg},${cb},${Math.min(1, a * l.power).toFixed(3)})`)
        stop(0, 1.0); stop(0.12, 0.82); stop(0.28, 0.55); stop(0.48, 0.3); stop(0.7, 0.12); stop(0.88, 0.035); stop(1, 0)
        g.fillStyle = lamp
        g.fillRect(-r, -r, 2 * r, 2 * r)
        g.restore()
    }
    // Where lamp and key light together clip to white, a warm 'multiply' pulls the pool
    // back to gold (red stays above green), so the lit stone reads as lamplight.
    g.globalCompositeOperation = 'multiply'
    for (const l of board.lights) {
        const c = {x: l.core.x, y: l.core.y + 0.8 * R}, r = 1.8 * R
        const tone = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, r)
        tone.addColorStop(0, 'rgb(255,204,140)')
        tone.addColorStop(0.5, 'rgb(255,228,190)')
        tone.addColorStop(1, 'rgb(255,255,255)')
        g.fillStyle = tone
        g.fillRect(c.x - r, c.y - r, 2 * r, 2 * r)
    }
    return map
}

// (d) Lamp bevels: the bevel faces of each tile turned towards the strongest nearby
// lamp catch its warm light ('lighter'), scaled by the lamp's falloff at the tile.
function drawBevels(ctx, board, cells) {
    world(ctx)
    ctx.globalCompositeOperation = 'lighter'
    for (const c of cells) {
        const lamp = lightVector(c.pos, board.lights)
        if (lamp.strength < 0.02) continue
        const lx = lamp.x / lamp.strength, ly = lamp.y / lamp.strength
        const strength = Math.min(1, lamp.best * 1.6)
        const v = depth.getVertices(c.pos)
        for (let i = 0; i < 6; ++i) {
            const n = edgeNormal(c.pos, v, i), f = n.x * lx + n.y * ly
            if (f <= 0.2) continue
            bevelPath(ctx, c.pos, v, i, 0.14)
            ctx.fillStyle = `rgba(255,190,96,${(0.75 * strength * (f - 0.2) / 0.8).toFixed(3)})`
            ctx.fill()
        }
    }
    ctx.globalCompositeOperation = 'source-over'
}

// (b) Bloom, added with 'screen' after lighting. A faint warm glow lifts the pool on the
// ground under the sprites; only a small core goes on top, at the cave mouth or window,
// so the unchanged sprite stays readable around its glowing opening.
function drawGlow(ctx, board) {
    world(ctx)
    ctx.globalCompositeOperation = 'screen'
    for (const l of board.lights) {
        const c = {x: l.core.x, y: l.core.y + 0.5 * R}, r = 1.5 * R
        const glow = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r)
        glow.addColorStop(0, 'rgba(255,196,96,0.7)')
        glow.addColorStop(0.22, 'rgba(255,180,84,0.3)')
        glow.addColorStop(0.6, 'rgba(255,180,90,0.05)')
        glow.addColorStop(1, 'rgba(255,170,80,0)')
        ctx.fillStyle = glow
        ctx.fillRect(c.x - r, c.y - r, 2 * r, 2 * r)
        // Bright spill on the floor just in front of the opening.
        const f = {x: l.core.x, y: l.core.y + 0.95 * R}
        ctx.save()
        ctx.translate(f.x, f.y)
        ctx.scale(1, 0.75)
        const spill = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.85 * R)
        spill.addColorStop(0, 'rgba(255,240,130,1)')
        spill.addColorStop(0.2, 'rgba(255,234,120,0.9)')
        spill.addColorStop(0.45, 'rgba(255,220,110,0.55)')
        spill.addColorStop(1, 'rgba(255,190,100,0)')
        ctx.fillStyle = spill
        ctx.fillRect(-0.85 * R, -0.85 * R, 1.7 * R, 1.7 * R)
        ctx.restore()
    }
    ctx.globalCompositeOperation = 'source-over'
}
function drawCores(ctx, board) {
    world(ctx)
    ctx.globalCompositeOperation = 'screen'
    for (const l of board.lights) {
        const c = l.core, r = 0.36 * R
        const core = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r)
        core.addColorStop(0, 'rgba(255,250,200,1)')
        core.addColorStop(0.25, 'rgba(255,240,140,1)')
        core.addColorStop(0.5, 'rgba(255,230,104,0.95)')
        core.addColorStop(0.75, 'rgba(255,196,60,0.45)')
        core.addColorStop(1, 'rgba(255,160,40,0)')
        ctx.fillStyle = core
        ctx.fillRect(c.x - r, c.y - r, 2 * r, 2 * r)
        // Wider faint halo around the opening.
        const halo = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, 0.7 * R)
        halo.addColorStop(0, 'rgba(255,190,80,0.35)')
        halo.addColorStop(1, 'rgba(255,150,40,0)')
        ctx.fillStyle = halo
        ctx.fillRect(c.x - 0.7 * R, c.y - 0.7 * R, 1.4 * R, 1.4 * R)
    }
    ctx.globalCompositeOperation = 'source-over'
}


function drawInterface(ctx) {
    const k = W / 1440
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.fillStyle = '#fff'
    for (let i = 0; i < 3; ++i) {
        const y = (44 + i * 28) * k
        ctx.beginPath(); ctx.roundRect(24 * k, y - 7 * k, 96 * k, 14 * k, 7 * k); ctx.fill()
    }
    ctx.drawImage(images.i, W - 140 * k, 0, 140 * k, 140 * k)
    ctx.drawImage(images.undo, 8 * k, H - 140 * k, 130 * k, 130 * k)
    ctx.fillStyle = '#f66'
    ctx.beginPath(); ctx.moveTo(W - 152 * k, H - 152 * k); ctx.lineTo(W - 4 * k, H - 78 * k)
    ctx.lineTo(W - 152 * k, H - 4 * k); ctx.closePath(); ctx.fill()
}

// Multiplies a layer by a light map and keeps only the layer's own pixels.
function light(layer, lightMap) {
    const g = layer.getContext('2d'), mask = canvasOf()
    mask.getContext('2d').drawImage(layer, 0, 0)
    g.setTransform(1, 0, 0, 1, 0, 0)
    // (f) Cream marble: the cream-tinted stone under the warm light, not new tile art.
    g.globalCompositeOperation = 'multiply'
    g.drawImage(lightMap, 0, 0)
    // Multiply also painted the empty surroundings; keep only the layer's pixels.
    g.globalCompositeOperation = 'destination-in'
    g.drawImage(mask, 0, 0)
    g.globalCompositeOperation = 'source-over'
    return mask
}

function render() {
    const board = buildBoard(), cells = boardCells()
    const ctx = view.getContext('2d')
    drawBackground(ctx)
    const lightMap = buildLightMap(board)

    // Ground layer: albedo and soft shadows (e), lit by the light map; then bevels.
    const ground = canvasOf(), g = ground.getContext('2d')
    drawAlbedo(g, board, cells)
    drawShadows(g, board)
    const groundMask = light(ground, lightMap)
    drawBevels(g, board, cells)
    drawGlow(g, board)
    g.setTransform(1, 0, 0, 1, 0, 0)
    g.globalCompositeOperation = 'destination-in'
    g.drawImage(groundMask, 0, 0)
    g.globalCompositeOperation = 'source-over'

    // Objects take a softened copy of the same light (sprites keep their own colours).
    // Sprites stand in front of their own lamp: they take the ambient and key light and
    // only part of the lamp light, so their colours are not washed out.
    const soft = canvasOf(), s = soft.getContext('2d')
    s.fillStyle = '#fff'
    s.fillRect(0, 0, W, H)
    s.globalAlpha = 0.82
    s.drawImage(buildLightMap(board, false), 0, 0)
    s.globalAlpha = 0.3
    s.drawImage(lightMap, 0, 0)
    const objects = canvasOf()
    drawObjects(objects.getContext('2d'), board)
    light(objects, soft)

    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.drawImage(ground, 0, 0)
    ctx.drawImage(objects, 0, 0)
    drawCores(ctx, board)
    drawInterface(ctx)
    window.prototypeInfo = {width: W, height: H, scale: camera.scale, origin: {x: camera.x, y: camera.y},
        lights: board.lights.length, objects: board.objects.length, ambient: AMBIENT, tailRadii: TAIL_RADII}
}


load().then(() => { render(); window.prototypeReady = true })
    .catch(error => { window.prototypeError = String(error && error.message || error) })
</script>
</body>
