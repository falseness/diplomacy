<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Original screen-space cloud study: cold blue banks and distant amber light. -->
  <defs>
    <linearGradient id="night" x2=".8" y2="1"><stop stop-color="#14283e"/><stop offset=".5" stop-color="#091524"/><stop offset="1" stop-color="#152f4c"/></linearGradient>
    <radialGradient id="blue"><stop stop-color="#527797" stop-opacity=".65"/><stop offset=".55" stop-color="#2e527b" stop-opacity=".5"/><stop offset="1" stop-color="#142b48" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop stop-color="#ebbd82" stop-opacity=".7"/><stop offset=".35" stop-color="#b77b4f" stop-opacity=".45"/><stop offset="1" stop-color="#936143" stop-opacity="0"/></radialGradient>
    <filter id="cloud" x="-25%" y="-35%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .016" numOctaves="3" seed="39" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="100" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <path fill="url(#night)" d="M0 0h1600v1000H0z"/>
  <g filter="url(#cloud)">
    <ellipse fill="url(#blue)" cx="190" cy="710" rx="490" ry="250"/>
    <ellipse fill="url(#blue)" cx="510" cy="920" rx="500" ry="180"/>
    <ellipse fill="url(#blue)" cx="1420" cy="400" rx="430" ry="290"/>
    <ellipse fill="url(#blue)" cx="1250" cy="1020" rx="540" ry="250"/>
    <ellipse fill="url(#amber)" cx="330" cy="70" rx="520" ry="290"/>
    <ellipse fill="url(#amber)" cx="40" cy="440" rx="300" ry="180"/>
    <ellipse fill="url(#amber)" cx="740" cy="1010" rx="370" ry="180"/>
  </g>
</svg>
