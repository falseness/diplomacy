<linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#498348" stop-opacity="0"/><stop offset="1" stop-color="#194330" stop-opacity="0.75"/></linearGradient>
<linearGradient id="crest" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf477"/><stop offset="1" stop-color="#cbd847" stop-opacity="0"/></linearGradient>
<linearGradient id="path" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd879"/><stop offset="1" stop-color="#c79a4f"/></linearGradient>
