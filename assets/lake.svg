  <title id="lake-title">Lake - painted miniature</title>
  <desc id="lake-desc">Irregular two-lobed blue lake retaining the source silhouette, with a sculpted stone shoreline, shallow turquoise water and restrained highlights. Transparent, editable vector sprite. Fixed upper-left lighting. All shapes and shading are vector; no embedded bitmap.</desc>
