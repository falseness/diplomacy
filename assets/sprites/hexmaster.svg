<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="hexmaster-title hexmaster-desc">
  <title id="hexmaster-title">Hexmaster — twin-hex staff demon miniature</title>
  <desc id="hexmaster-desc">A senior hexcaster: an ivory-faced demon with swept-back curling horns in a deep violet robe with a high golden-trimmed mantle holds a taller crescent staff crowned with a hex gem, while two golden hex spells orbit its raised hand. Archer's leg silhouette, head scale and foot baseline preserve the shared miniature proportions. Rounded vector shading is lit from the upper right. Editable shapes on a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="hxm-cloth" cx="78%" cy="19%" r="99%">
      <stop stop-color="#8a6aa6"/><stop offset=".35" stop-color="#5e4380"/><stop offset=".72" stop-color="#3f2a5c"/><stop offset="1" stop-color="#281a3e"/>
    </radialGradient>
    <radialGradient id="hxm-skin" cx="72%" cy="24%" r="86%">
      <stop stop-color="#f2e6c2"/><stop offset=".4" stop-color="#c8c5ac"/><stop offset=".75" stop-color="#929d98"/><stop offset="1" stop-color="#586979"/>
    </radialGradient>
    <linearGradient id="hxm-boots" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop stop-color="#231a33"/><stop offset=".7" stop-color="#5b4d6e"/><stop offset="1" stop-color="#352a48"/>
    </linearGradient>
    <linearGradient id="hxm-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#81643b"/><stop offset=".55" stop-color="#c8a668"/><stop offset="1" stop-color="#f2d99b"/>
    </linearGradient>
    <radialGradient id="hxm-spell-paint" cx="72%" cy="22%" r="85%">
      <stop stop-color="#fff3bb"/><stop offset=".5" stop-color="#e8c579"/><stop offset="1" stop-color="#b18444"/>
    </radialGradient>
    <radialGradient id="hxm-gem" cx="65%" cy="30%" r="80%">
      <stop stop-color="#f6d8ff"/><stop offset=".5" stop-color="#b56ae0"/><stop offset="1" stop-color="#5b2887"/>
    </radialGradient>
  </defs>
