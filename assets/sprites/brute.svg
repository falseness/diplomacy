<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="brute-title brute-desc">
  <title id="brute-title">Brute — broad-shouldered tusked demon</title>
  <desc id="brute-desc">A heavy ochre demon with a thick neck, broad rounded shoulders, oversized closed fists and two upward ivory tusks. Normchel's planted leg silhouette and head scale anchor the shared miniature proportions; a wider bare torso and dark iron wrist bands distinguish this brawler. Smooth directional volume shading, editable vector shapes and a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="brute-skin" cx="74%" cy="22%" r="89%">
      <stop stop-color="#e7ba7c"/><stop offset=".38" stop-color="#c18a51"/><stop offset=".72" stop-color="#966039"/><stop offset="1" stop-color="#593c30"/>
    </radialGradient>
    <radialGradient id="brute-body" cx="78%" cy="19%" r="99%">
      <stop stop-color="#dbae6e"/><stop offset=".3" stop-color="#b58048"/><stop offset=".65" stop-color="#915932"/><stop offset="1" stop-color="#59382c"/>
    </radialGradient>
    <linearGradient id="brute-limb" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop stop-color="#6d442e"/><stop offset=".42" stop-color="#b17a43"/><stop offset=".75" stop-color="#d9a669"/><stop offset="1" stop-color="#95603a"/>
    </linearGradient>
    <radialGradient id="brute-iron" cx="74%" cy="22%" r="89%">
      <stop stop-color="#97968a"/><stop offset=".4" stop-color="#696c64"/><stop offset="1" stop-color="#303b39"/>
    </radialGradient>
    <radialGradient id="brute-cloth" cx="78%" cy="19%" r="99%">
      <stop stop-color="#858471"/><stop offset=".4" stop-color="#5c6051"/><stop offset="1" stop-color="#303d34"/>
    </radialGradient>
    <linearGradient id="brute-ivory" x1="0%" y1="80%" x2="100%" y2="15%">
      <stop stop-color="#8d744e"/><stop offset=".42" stop-color="#ccb486"/><stop offset=".74" stop-color="#f3e1b6"/><stop offset="1" stop-color="#fff1ce"/>
    </linearGradient>
  </defs>
