<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="bulwark-title bulwark-desc">
  <title id="bulwark-title">Bulwark — horned armored shield guardian</title>
  <desc id="bulwark-desc">A compact demon enclosed in blue iron plate, with curled ivory helmet horns, an amber visor and a broad bronze-rimmed tower shield held forward. Normchel's planted legs and head scale preserve shared miniature proportions. Rounded volume shading, individually editable vector armor and a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="bulwark-plate" cx="76%" cy="20%" r="94%">
      <stop stop-color="#9faeb1"/><stop offset=".36" stop-color="#71878e"/><stop offset=".72" stop-color="#465b66"/><stop offset="1" stop-color="#28373f"/>
    </radialGradient>
    <radialGradient id="bulwark-shield" cx="77%" cy="18%" r="98%">
      <stop stop-color="#82979e"/><stop offset=".4" stop-color="#526b77"/><stop offset="1" stop-color="#243943"/>
    </radialGradient>
    <linearGradient id="bulwark-bronze" x1="0%" y1="80%" x2="100%" y2="15%">
      <stop stop-color="#695335"/><stop offset=".45" stop-color="#af9059"/><stop offset=".78" stop-color="#d8bd82"/><stop offset="1" stop-color="#e8d6a8"/>
    </linearGradient>
    <linearGradient id="bulwark-horn" x1="0%" y1="90%" x2="100%" y2="10%">
      <stop stop-color="#8e7d5d"/><stop offset=".5" stop-color="#ccbf9a"/><stop offset="1" stop-color="#f1e5c5"/>
    </linearGradient>
  </defs>
