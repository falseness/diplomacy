<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="imp-title imp-desc">
  <title id="imp-title">Imp — horned demon miniature</title>
  <desc id="imp-desc">A small crimson imp with ivory horns, pointed ears, amber eyes, clawed hands, cloven hooves and a curling arrow-tipped tail. Noob/Normchel miniature proportions with rounded limbs, a compact torso and smooth volume shading. Ivory horns and an exposed arrow-tail silhouette distinguish this unarmed melee demon at board scale. Transparent vector artwork.</desc>
