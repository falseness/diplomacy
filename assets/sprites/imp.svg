      <stop stop-color="#763044"/>
      <stop offset=".48" stop-color="#c65d57"/>
      <stop offset=".76" stop-color="#df826a"/>
      <stop offset="1" stop-color="#99404a"/>
    </linearGradient>
    <linearGradient id="imp-horn" x1="0%" y1="80%" x2="100%" y2="15%">
