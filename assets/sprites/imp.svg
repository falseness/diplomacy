      <stop stop-color="#eea079"/>
      <stop offset=".34" stop-color="#cf695b"/>
      <stop offset=".7" stop-color="#a13f48"/>
      <stop offset="1" stop-color="#632b3b"/>
    </radialGradient>
    <radialGradient id="imp-body" cx="76%" cy="18%" r="98%">
