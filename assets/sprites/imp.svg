    <linearGradient id="imp-gold" x1="0%" y1="0%" x2="100%" y2="25%">
      <stop stop-color="#947039"/>
      <stop offset=".65" stop-color="#e7c780"/>
      <stop offset="1" stop-color="#b28a47"/>
