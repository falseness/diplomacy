<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Wall — low crenellated barrier</title>
  <desc id="desc">A long low wall with four oversized crenels and no doors, windows or towers. Its shallow rectangular silhouette remains distinct from both fortifications at small sizes. Pure vector artwork, transparent background, shared lower anchor at y=458, light from upper left. No embedded images, textures, fonts or external resources. Stronger warm stone contours and more contrasting side planes clarify the existing edges without adding decorative detail.</desc>
