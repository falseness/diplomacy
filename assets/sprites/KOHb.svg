  <title id="kh-horseman-title">Horseman — simplified miniature</title>
  <desc id="kh-horseman-desc">Horse and rider with plain green shirt, tan trousers, one-piece boots, simple saddle blanket, noseband and rein. Original horse silhouette and riding pose preserved. Smooth shading, transparent 512 by 512 canvas, editable vectors. No decorative straps, edging, cuffs, knee patches, stirrups or texture filters.</desc>
