<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="lord-title lord-desc">
  <title id="lord-title">Demon Lord — crowned sovereign in obsidian armor</title>
  <desc id="lord-desc">A horn-crowned demon with a crimson mantle, broad gold-edged black plate, a red breastplate jewel and a heavy notched sword. Normchel's exact planted legs and 62.5-radius head preserve the shared miniature scale. Smooth upper-right lighting, transparent canvas and individually editable vector shapes.</desc>
