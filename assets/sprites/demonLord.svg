    <linearGradient id="lord-gold" x1="0%" y1="80%" x2="100%" y2="15%"><stop stop-color="#796039"/><stop offset=".42" stop-color="#ba934f"/><stop offset=".76" stop-color="#edd08a"/><stop offset="1" stop-color="#fae6ae"/></linearGradient>
    <linearGradient id="lord-blade" x1="0%" y1="30%" x2="100%" y2="0%"><stop stop-color="#4c5260"/><stop offset=".48" stop-color="#a7acb0"/><stop offset=".5" stop-color="#69717c"/><stop offset="1" stop-color="#d7d7cc"/></linearGradient>
