    <radialGradient id="lord-plate" cx="78%" cy="19%" r="99%"><stop stop-color="#85878a"/><stop offset=".35" stop-color="#55555f"/><stop offset=".7" stop-color="#35313f"/><stop offset="1" stop-color="#211e2c"/></radialGradient>
    <radialGradient id="lord-mantle" cx="78%" cy="19%" r="99%"><stop stop-color="#c85b68"/><stop offset=".38" stop-color="#983544"/><stop offset="1" stop-color="#481d35"/></radialGradient>
