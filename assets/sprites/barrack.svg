  <title id="title">Barrack — single-tent training camp</title>
  <desc id="description">Cream A-frame tent with an open entrance, a wooden practice dummy and round shield on the left, and a rack holding two swords with a leaning shield on the right. Three-quarter miniature, neutral colors, upper-left lighting, and a transparent background. Editable vector paths and gradients only; no embedded raster images.</desc>
