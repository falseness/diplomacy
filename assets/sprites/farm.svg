  <title id="farm-title">Farm — painted miniature</title>
  <desc id="farm-desc">Wooden farmhouse with a brown gabled roof, golden divided window, pale rounded door and a square chimney with a rising plume of smoke. Three-quarter view matching the town miniature. Transparent editable vector sprite with upper-left lighting and continuous structural joints. No embedded bitmap or external resources.</desc>
