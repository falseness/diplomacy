<title id="title">Painted miniature gold mine</title>
<desc id="desc">Warm limestone cave entrance matching the painted miniature reference, faceted arch stones, dark recess, tiny gold nuggets and contact shadows. Transparent editable vector, 512 by 512.</desc>
