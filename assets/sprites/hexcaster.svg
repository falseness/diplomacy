<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="hexcaster-title hexcaster-desc">
  <title id="hexcaster-title">Hexcaster — fork-staff demon miniature</title>
  <desc id="hexcaster-desc">An ivory-faced horned demon in a midnight-blue split robe holds a tall forked staff and a floating golden hex spell. Archer's leg silhouette, head scale and foot baseline preserve the shared miniature proportions. Rounded vector shading is lit from the upper right. Editable shapes on a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="hex-cloth" cx="78%" cy="19%" r="99%">
      <stop stop-color="#667a9a"/><stop offset=".35" stop-color="#3e5375"/><stop offset=".72" stop-color="#293854"/><stop offset="1" stop-color="#1c253d"/>
    </radialGradient>
    <radialGradient id="hex-skin" cx="72%" cy="24%" r="86%">
      <stop stop-color="#f2e6c2"/><stop offset=".4" stop-color="#c8c5ac"/><stop offset=".75" stop-color="#929d98"/><stop offset="1" stop-color="#586979"/>
    </radialGradient>
    <linearGradient id="hex-boots" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop stop-color="#202b3a"/><stop offset=".7" stop-color="#586575"/><stop offset="1" stop-color="#303e50"/>
    </linearGradient>
    <linearGradient id="hex-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#81643b"/><stop offset=".55" stop-color="#c8a668"/><stop offset="1" stop-color="#f2d99b"/>
    </linearGradient>
    <radialGradient id="hex-spell-paint" cx="72%" cy="22%" r="85%">
      <stop stop-color="#fff3bb"/><stop offset=".5" stop-color="#e8c579"/><stop offset="1" stop-color="#b18444"/>
    </radialGradient>
  </defs>
