<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="ravager-title ravager-desc">
<title id="ravager-title">Ravager — charging armored beast, left-facing</title>
<desc id="ravager-desc">Left-facing heavy demon quadruped with KOHb's staggered running legs, a hunched burgundy carapace, ivory dorsal blades, broad lowered jaw and a forward siege horn. Smooth upper-right miniature lighting; editable vectors on transparent canvas. No rider or tack.</desc>
