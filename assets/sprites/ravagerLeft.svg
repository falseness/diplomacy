<radialGradient id="ravager-body" cx="65%" cy="24%" r="84%"><stop stop-color="#b66c7c"/><stop offset=".4" stop-color="#874358"/><stop offset="1" stop-color="#422638"/></radialGradient>
<radialGradient id="ravager-neck" cx="83%" cy="15%" r="105%"><stop stop-color="#d09197"/><stop offset=".4" stop-color="#99566a"/><stop offset="1" stop-color="#502c40"/></radialGradient>
<radialGradient id="ravager-rear" cx="76%" cy="18%" r="96%"><stop stop-color="#815469"/><stop offset="1" stop-color="#362637"/></radialGradient>
<radialGradient id="ravager-paw" cx="76%" cy="18%" r="96%"><stop stop-color="#7a717d"/><stop offset="1" stop-color="#2c2835"/></radialGradient>
<linearGradient id="ravager-ivory" x1="0%" y1="80%" x2="100%" y2="15%"><stop stop-color="#958476"/><stop offset=".5" stop-color="#dac8a5"/><stop offset="1" stop-color="#fff0ce"/></linearGradient>
</defs>
