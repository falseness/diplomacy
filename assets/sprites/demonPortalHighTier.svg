<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
<title id="title">High tier demon portal: crowned gate with floating shards and eye rift</title>
<desc id="desc">Obsidian arch from the base demon portal. A five-spiked gold crown, two floating obsidian shards and a slit-pupil eye in a violet-gold rift mark the high tier category (ravager, demon lord). Transparent editable vector, 512 by 512.</desc>
