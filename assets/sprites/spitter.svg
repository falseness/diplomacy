<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="spitter-title spitter-desc">
  <title id="spitter-title">Spitter — acid-spitting demon miniature</title>
  <desc id="spitter-desc">A teal, amphibious biped braces on Archer-proportioned legs, aiming its long open snout to the right. A swollen golden throat sac and a detached lime spit glob mark its ranged attack. Small dorsal fins, folded grasping arms and webbed toes distinguish it from armed humans and melee demons. Rounded volumes with upper-right lighting; editable vector artwork on a transparent background.</desc>
  <defs>
    <radialGradient id="spitter-skin" cx="76%" cy="22%" r="94%">
      <stop stop-color="#94c7b1"/><stop offset=".36" stop-color="#559e90"/><stop offset=".73" stop-color="#34776f"/><stop offset="1" stop-color="#254b50"/>
    </radialGradient>
    <linearGradient id="spitter-limb" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop stop-color="#29565b"/><stop offset=".48" stop-color="#4a9186"/><stop offset=".77" stop-color="#7db8a2"/><stop offset="1" stop-color="#396e69"/>
    </linearGradient>
    <radialGradient id="spitter-sac" cx="73%" cy="22%" r="92%">
      <stop stop-color="#e9dc96"/><stop offset=".4" stop-color="#c0b869"/><stop offset="1" stop-color="#767447"/>
    </radialGradient>
    <radialGradient id="spitter-acid" cx="70%" cy="22%" r="84%">
      <stop stop-color="#eff6b0"/><stop offset=".4" stop-color="#cadb6e"/><stop offset="1" stop-color="#839e3e"/>
    </radialGradient>
    <linearGradient id="spitter-fin" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#31545a"/><stop offset="1" stop-color="#91aa83"/>
    </linearGradient>
  </defs>
