<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="demonQueen-title demonQueen-desc">
  <title id="demonQueen-title">Demon Queen — crowned hex sovereign miniature</title>
  <desc id="demonQueen-desc">The apex of the hexcaster line: an ivory-faced demon queen wearing a spiked golden crown between tall curling horns, in a crimson-and-black royal gown with a flared golden-trimmed cape, holds a sceptre staff crowned with a ruby hex and commands three orbiting golden hex spells. Archer's leg silhouette, head scale and foot baseline preserve the shared miniature proportions. Rounded vector shading is lit from the upper right. Editable shapes on a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="dq-cloth" cx="78%" cy="19%" r="99%">
      <stop stop-color="#b8484f"/><stop offset=".35" stop-color="#8a2632"/><stop offset=".72" stop-color="#5c1422"/><stop offset="1" stop-color="#360a16"/>
    </radialGradient>
    <linearGradient id="dq-cape" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#3a2a44"/><stop offset=".6" stop-color="#1e1426"/><stop offset="1" stop-color="#120a18"/>
    </linearGradient>
    <radialGradient id="dq-skin" cx="72%" cy="24%" r="86%">
      <stop stop-color="#f6ecd2"/><stop offset=".4" stop-color="#d4cbb4"/><stop offset=".75" stop-color="#a0a29c"/><stop offset="1" stop-color="#626c7a"/>
    </radialGradient>
    <linearGradient id="dq-boots" x1="0%" y1="0%" x2="100%" y2="15%">
      <stop stop-color="#1e1016"/><stop offset=".7" stop-color="#553440"/><stop offset="1" stop-color="#34202a"/>
    </linearGradient>
    <linearGradient id="dq-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop stop-color="#81643b"/><stop offset=".55" stop-color="#d2b06e"/><stop offset="1" stop-color="#f8e2a6"/>
    </linearGradient>
    <radialGradient id="dq-spell-paint" cx="72%" cy="22%" r="85%">
      <stop stop-color="#fff3bb"/><stop offset=".5" stop-color="#e8c579"/><stop offset="1" stop-color="#b18444"/>
    </radialGradient>
    <radialGradient id="dq-ruby" cx="65%" cy="30%" r="80%">
      <stop stop-color="#ffd0d0"/><stop offset=".45" stop-color="#e2404e"/><stop offset="1" stop-color="#7a0f1e"/>
    </radialGradient>
  </defs>
