    </linearGradient>
    <radialGradient id="dq-iris" cx="50%" cy="40%" r="60%">
      <stop stop-color="#fff2a0"/><stop offset=".5" stop-color="#ff7a2a"/><stop offset="1" stop-color="#a0102a"/>
