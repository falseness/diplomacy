<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="demonQueen-title demonQueen-desc">
  <title id="demonQueen-title">Demon Queen — crowned hex sovereign miniature</title>
  <desc id="demonQueen-desc">The apex of the hexcaster line, styled as a chibi succubus queen: crimson demon skin, a glossy black hime cut with jagged bangs, curved red horns around a jewelled golden tiara, pointed ears with gold hoops, and smug half-lidded ember eyes glancing sideways above a fanged smirk. Bat wings and a spade-tipped tail frame a fitted plum gown with a sweetheart neckline, gold girdle and flared skirt over a black royal cape; she holds a ruby-crowned sceptre and commands three orbiting golden hex spells. Rounded vector shading is lit from the upper right. Editable shapes on a transparent 512 by 512 canvas.</desc>
  <defs>
    <radialGradient id="dq-cloth" cx="78%" cy="19%" r="99%">
      <stop stop-color="#9a5aae"/><stop offset=".35" stop-color="#6a2e80"/><stop offset=".72" stop-color="#421856"/><stop offset="1" stop-color="#260c34"/>
    </radialGradient>
    <linearGradient id="dq-cape" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#3a2a44"/><stop offset=".6" stop-color="#1e1426"/><stop offset="1" stop-color="#120a18"/>
    </linearGradient>
    <radialGradient id="dq-skin" cx="70%" cy="24%" r="90%">
      <stop stop-color="#ff8a80"/><stop offset=".4" stop-color="#e24a52"/><stop offset=".8" stop-color="#b8243a"/><stop offset="1" stop-color="#7e1028"/>
    </radialGradient>
    <linearGradient id="dq-horn" x1="0%" y1="100%" x2="40%" y2="0%">
