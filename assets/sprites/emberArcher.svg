  <title id="ea-archer-title">Ember Archer — cinder bow demon miniature</title>
  <desc id="ea-archer-desc">Archer's original stance, limbs and angled bow, reworked as a charcoal-clad demon with copper skin, swept cinder horns, glowing eyes and ember seams. A flame-tipped arrow and molten bow edges identify the ranged fire variant at miniature scale. Upper-right lighting; editable vector shapes on a transparent 512 by 512 canvas.</desc>
