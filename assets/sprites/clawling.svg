      <path id="clawling-right-middle-claw" d="M409 310 Q396 303 390 321 Q403 356 412 396 Q433 365 422 337Z"/>
      <path id="clawling-right-inner-claw" d="M382 310 Q368 304 364 321 Q372 350 371 375 Q392 359 393 340Z"/>
    </g>
  </g>
  <g id="clawling-head">
    <circle cx="256" cy="91" r="62.5" fill="url(#clawling-skin)"/>
    <path d="M212 76 L242 85 Q231 102 216 92Z M270 85 L300 76 L296 92 Q281 102 270 85Z" fill="#ffe5a1"/>
    <path d="M229 84 V94 M283 84 V94" stroke="#302734" stroke-width="6" stroke-linecap="round"/>
    <path d="M212 72 L242 81 M270 81 L300 72" stroke="#57375e" stroke-width="6" stroke-linecap="round"/>
    <path d="M256 87 L249 107 L263 107" fill="#78517e"/>
    <path d="M234 120 Q256 129 278 120" stroke="#49334f" stroke-width="5" stroke-linecap="round"/>
    <path d="M238 122 L247 125 L242 135Z M265 125 L274 122 L270 135Z" fill="url(#clawling-ivory)"/>
  </g>
</svg>
