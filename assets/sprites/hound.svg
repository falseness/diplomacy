<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="hound-title hound-desc">
<title id="hound-title">Hound — running horned quadruped</title>
<desc id="hound-desc">Right-facing charcoal demon hound in KOHb's running pose, with the same torso and hind-leg geometry, four staggered legs, a low canine muzzle, swept ivory horns, amber eye and pointed tail. Smooth miniature shading matches the existing units. No rider or tack. Editable vectors on transparent canvas.</desc>
<defs>
<radialGradient id="hound-body" cx="65%" cy="24%" r="84%"><stop stop-color="#90938d"/><stop offset=".33" stop-color="#626b68"/><stop offset=".67" stop-color="#424c4e"/><stop offset="1" stop-color="#282e37"/></radialGradient>
<radialGradient id="hound-neck" cx="83%" cy="15%" r="105%"><stop stop-color="#a4a39a"/><stop offset=".33" stop-color="#747e78"/><stop offset=".67" stop-color="#4e5c59"/><stop offset="1" stop-color="#303b40"/></radialGradient>
<radialGradient id="hound-rear" cx="76%" cy="18%" r="96%"><stop stop-color="#67716c"/><stop offset=".5" stop-color="#424d4b"/><stop offset="1" stop-color="#252d36"/></radialGradient>
<radialGradient id="hound-paw" cx="76%" cy="18%" r="96%"><stop stop-color="#868880"/><stop offset=".5" stop-color="#555f5b"/><stop offset="1" stop-color="#2b3438"/></radialGradient>
<linearGradient id="hound-ivory" x1="0%" y1="80%" x2="100%" y2="15%"><stop stop-color="#857159"/><stop offset=".4" stop-color="#c5b18b"/><stop offset=".75" stop-color="#f2e4bc"/><stop offset="1" stop-color="#fff4d3"/></linearGradient>
</defs>
